name: Project Artha Scanner
on:
  schedule:
    - cron: "45 10 * * 1-5"   # 10:45 UTC, Mon–Fri
  workflow_dispatch:           # Allows manual run
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10        # Increased a bit for safety
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate Telegram credentials
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          echo "Token length: ${#BOT_TOKEN}"
          echo "Testing getMe..."
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getMe"
          echo
          echo "Testing sendMessage..."
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=Project Artha credential test - $(date -u)"
      - name: Run live scan
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # GITHUB_TOKEN is automatically available – do not override it
        run: |
          python main.py
