name: Probe BSE/NSE Sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi yfinance

      - name: Run probe
        run: python scripts/probe_sources.py